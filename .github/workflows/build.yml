name: Build PlayTube APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Source Code
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

      - name: Update Website URL to friendza.pro
        run: |
          TARGET_DIR="extracted_project/PlayTube"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="extracted_project"
          fi
          find "$TARGET_DIR" -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's|http://demo.playtubescript.com|https://friendza.pro|g' {} + || true
          find "$TARGET_DIR" -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's|https://demo.playtubescript.com|https://friendza.pro|g' {} + || true
          find "$TARGET_DIR" -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's|http://yourdomain.com|https://friendza.pro|g' {} + || true
          find "$TARGET_DIR" -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's|https://yourdomain.com|https://friendza.pro|g' {} + || true

      - name: Build APK with Gradle
        run: |
          PROJECT_DIR="extracted_project/PlayTube"
          if [ ! -d "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(dirname $(find extracted_project -name "build.gradle" | head -n 1))
          fi
          echo "Working in project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTube-App-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/app/build/outputs/apk/release/*.apk
