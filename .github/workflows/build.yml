name: Build PlayTube APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Inspect and List ZIP Contents
        run: |
          echo "=== Root Repository Files ==="
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          echo "Target ZIP file: $ZIP_FILE"
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Error: No ZIP file found in the repository!"
            exit 1
          fi
          
          echo "=== List of all files inside the ZIP ==="
          unzip -l "$ZIP_FILE"
          
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          
          echo "=== Directory structure after extraction ==="
          find extracted_project -maxdepth 3
