name: Build PlayTube APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Source Code
        run: |
          echo "=== Repository Files ==="
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          echo "=== All Extracted Files and Folders ==="
          find extracted_project -maxdepth 3

      - name: Update Website URL to friendza.pro
        run: |
          find extracted_project -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's|http://demo.playtubescript.com|https://friendza.pro|g' {} +
          find extracted_project -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's|https://demo.playtubescript.com|https://friendza.pro|g' {} +
          find extracted_project -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's|http://yourdomain.com|https://friendza.pro|g' {} +
          find extracted_project -type f \( -name "*.java" -o -name "*.kt" -o -name "*.xml" \) -exec sed -i 's|https://yourdomain.com|https://friendza.pro|g' {} +

      - name: Build APK with Gradle
        run: |
          GRADLEW_PATH=$(find extracted_project -iname "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Warning: gradlew not found, searching for build.gradle..."
            BUILD_FILE=$(find extracted_project -name "build.gradle" | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
              echo "Found build.gradle in: $PROJECT_DIR, generating gradle wrapper..."
              cd "$PROJECT_DIR"
              gradle wrapper
              chmod +x gradlew
            else
              echo "Error: Neither gradlew nor build.gradle found!"
              exit 1
            fi
          else
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew in directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew
          fi
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTube-App-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/app/build/outputs/apk/release/*.apk
