name: Build PlayTube APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip Source Code
        run: |
          echo "=== Root Files in Repository ==="
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project
          echo "=== ALL Extracted Files and Folders Inside ZIP ==="
          ls -R extracted_project

      - name: Build APK with Gradle
        run: |
          BUILD_FILE=$(find extracted_project -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found anywhere in extracted files!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found Android project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTube-App-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/app/build/outputs/apk/release/*.apk
